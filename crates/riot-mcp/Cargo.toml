[package]
name = "riot-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP 客户端：stdio 服务器连接、工具适配、连接枢纽"

[dependencies]
riot-protocol = { workspace = true }
# 只用 tools::shrink：MCP 返回的图片和截图走同一条"给模型前压小"的路。
# 依赖方向无环（tools 不依赖 mcp），kernel 同时依赖两者。
riot-tools = { workspace = true }
async-trait = { workspace = true }
# MCP 的图片内容块是 base64，落盘原图前要解码。
base64 = "0.22"
process-wrap = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
# FakeVision / MemFs / Null 系列替身，测 McpTool 的图片交付分支。
riot-tools = { workspace = true, features = ["testing"] }
# 用**真实的决策链**验证 MCP 工具落在哪一档。只断言 check_permissions
# 的返回值证明不了最终行为 —— 那条链有七步，工具的 Ask 会不会被后面的
# 步骤压过、压过它的是谁，全在链里。依赖方向无环（permissions 不依赖
# mcp），而且只在测试里。
riot-permissions = { workspace = true }
