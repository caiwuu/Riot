[package]
name = "riot-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Windows 沙箱的底层实现（vendored，见 vendor/srt-win/NOTICE.md）。内核这里
# 只用它一件事：`main.rs` 的 multicall 分发。真正的编排在 riot-runtime 的
# `sandbox_win`，它通过 `current_exe()` 回头调这个二进制。
[target.'cfg(windows)'.dependencies]
srt-win = { path = "../../vendor/srt-win" }

[dependencies]
riot-core = { workspace = true }
riot-mcp = { workspace = true }
riot-permissions = { workspace = true }
riot-protocol = { workspace = true }
riot-providers = { workspace = true }
riot-runtime = { workspace = true }
riot-store = { workspace = true }
riot-tools = { workspace = true }

async-trait = { workspace = true }
base64 = "0.22"
encoding_rs = { workspace = true }
futures = { workspace = true }
htmd = { workspace = true }
ignore = "0.4.33"
regex-lite = "0.1.9"
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
similar = { version = "3.1.2", default-features = false, features = ["text", "inline"] }
thiserror = { workspace = true }
# io-std:stdin()/stdout() 是内核的 JSON-RPC 传输通道。workspace 基础
# features 里没有它(其它 crate 不需要),在这里单独追加。
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
# 测试要用 ScriptedProvider 等替身。生产依赖（上面那份）不带这个
# feature —— 测试构建靠 feature 并集拿到它，发布构建保持干净。
riot-core = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
