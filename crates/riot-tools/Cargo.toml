[package]
name = "riot-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "工具注册表、并发分批调度与执行管线"

[dependencies]
riot-permissions = { workspace = true }
riot-protocol = { workspace = true }

async-stream = { workspace = true }
async-trait = { workspace = true }
# Read 读到图片文件时要编码成 base64 交给模型（或视觉兼容模型）。
base64 = "0.22"
encoding_rs = { workspace = true }
futures = { workspace = true }
futures-core = { workspace = true }
htmd = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
regex-lite = "0.1.9"
# 截图/读图给模型前的压缩。gif 不解（其解码依赖版本冲突），gif 原样发 ——
# 上限兜底在（MAX_SHOT_B64 / MAX_IMAGE_BYTES），只是少了压缩优化。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"

[features]
# 让下游测试能用工具替身。生产构建不带。
testing = []

[dev-dependencies]
async-trait = { workspace = true }
# core 只在测试里用：验证真实调度器接进主循环后配对成立。
# 生产依赖方向仍是 protocol ← core 与 protocol ← tools，无环。
riot-core = { workspace = true }
# 自引用打开 testing feature，这样 `cargo test -p riot-tools` 不用
# 额外带 --features 就能跑集成测试 —— 本地和 CI 的命令保持一致。
riot-tools = { path = ".", features = ["testing"] }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
