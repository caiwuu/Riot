[package]
name = "riot-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "注入 trait 的真实实现：进程、文件系统、时钟"

[dependencies]
riot-protocol = { workspace = true }

async-trait = { workspace = true }
process-wrap = { workspace = true }
reqwest = { workspace = true }
# 沙箱标签清单的持久化（Windows Low IL 标签的孤儿回收）。
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# 只为一条测试：钉住 `sandbox_win` 里写死的分发标记和上游常量一致。
# 编排本身不链接它 —— 走的是 multicall 子进程（见 sandbox_win 模块头），
# 链接它的是内核和宿主两个**二进制**。
[target.'cfg(windows)'.dev-dependencies]
srt-win = { path = "../../vendor/srt-win" }

[dev-dependencies]
libc = "0.2.189"
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# 沙箱激活失败的原因只走 `tracing::warn!`。测试进程默认没有 subscriber，
# 那些原因会被直接丢掉 —— 而 Windows 沙箱恰恰是最依赖这些原因的地方
# （本机是 Mac，只能靠 CI 日志断案）。
tracing-subscriber = { workspace = true }
