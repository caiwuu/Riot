[package]
name = "riot-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
riot-protocol = { workspace = true }
schemars = { workspace = true }

async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
futures-core = { workspace = true }
pin-project-lite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[features]
# 让下游测试能用 ScriptedProvider 等替身。生产构建不带 ——
# 758 行测试基建没有理由进发布的二进制。
testing = []

[dev-dependencies]
pretty_assertions = { workspace = true }
# 自引用打开 testing feature：本 crate 的 tests/ 目录（黄金回放、混沌）
# 以外部 crate 的身份链接 lib，光有 cfg(test) 看不到 testing 模块。
riot-core = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
