# 两人小团队：日常 push 只拦「干净机器上内核还过、协议没漂、Windows 宿主还能编」。
# rustfmt、变异、release 复测、macOS host、混沌长跑放到 nightly / 手动，避免改 UI 也被锚点卡住。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # 内核侧不碰 Tauri，省掉 Linux 上那一大坨 WebKitGTK。
  KERNEL_ONLY: --workspace --exclude riot-host

jobs:
  # L1 协议契约：生成物必须与源类型一致
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - name: 检查协议生成物与 Rust 类型同步
        run: |
          git diff --exit-code schemas/ src/bridge/generated.ts || {
            echo "::error::改了 crates/riot-protocol 但没跑 pnpm gen"
            exit 1
          }
      - run: pnpm typecheck

  # clippy 的 disallowed-methods 是安全闸；debug 测试带着 L2 不变量。
  # golden / fault / e2e 都在 --workspace 里，不再拆 job 重编一遍。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ env.KERNEL_ONLY }} --all-targets -- -D warnings
      - run: cargo test ${{ env.KERNEL_ONLY }}
      - name: 确认没人把黄金基准更新固化进流程
        run: |
          git diff --exit-code crates/riot-core/tests/golden || {
            echo "::error::黄金基准在 CI 里被改写了"
            exit 1
          }

  # 本机是 Mac，跨平台回归全靠 Windows。
  # job 级 if 读不了 matrix，所以 macOS 拆成单独 job，只在 nightly / 手动跑。
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/prepare-host
      - run: cargo clippy -p riot-host --all-targets -- -D warnings
      - run: cargo test -p riot-host
      # Windows 沙箱的后端只在这个平台编译，本机 Mac 碰不到 ——
      # clippy 和 token 单测都得靠这里真跑。
      - run: cargo clippy -p riot-runtime --all-targets -- -D warnings
      - run: cargo test -p riot-runtime
      # vendored 的 srt-win（见 vendor/srt-win/NOTICE.md）。只编不测：
      # 便宜，但能在每次 push 上拦住「拷进来的树编不过」这一类问题。真机
      # 行为验证在下面的 win-sandbox-smoke，那个太重、只按需跑。
      #
      # 不带 --all-targets：它的单测里有一处 include_bytes! 指向上游 npm
      # 仓库的 fixture，不在 vendored 范围内（理由见 NOTICE.md）。
      - run: cargo clippy -p srt-win -- -D warnings
      - run: cargo test -p srt-win --test sd_access_check_matrix

  # vendored srt-win 的**真机**验证：跑上游自带的冒烟脚本。
  #
  # 这是本机 Mac 完全够不到的那一层。`scripts/check-windows-sandbox.sh` 只能
  # 证明 FFI 签名和类型对得上；「建出来的账户是不是真的建了、ACE 写下去沙箱
  # 账户是不是真能写那棵树、受限令牌起的进程是不是真被关住」只有这里说了算。
  #
  # `[约束]` 这些脚本是**破坏性**的：真的建本地用户账户、装机器级 WFP 过滤
  # 器、改 ACL。所以只在一次性的 runner 上跑，而且收尾的 cleanup 必须
  # `if: always()` —— 中途 throw 的话残留会留在机器上（上游的 cleanup.ps1
  # 头注释就是这么写的）。
  #
  # 各脚本用的是**互不相同的测试专用 sublayer GUID**，都不是生产默认值，
  # cleanup.ps1 的默认参数与之一一对应 —— 所以不用给它传 GUID。
  win-sandbox-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # release：冒烟脚本要起真进程、等超时，debug 构建慢到会把
      # smoke-kill 的时序断言压垮。
      - run: cargo build -p srt-win --release
      - name: 安装/卸载生命周期
        run: pwsh vendor/srt-win/ci/smoke.ps1 target\release\srt-win.exe
      - name: 沙箱内执行（受限令牌 + job + 桌面）
        run: pwsh vendor/srt-win/ci/smoke-exec.ps1 target\release\srt-win.exe
      - name: 附加 ACE 的授予与回收
        run: pwsh vendor/srt-win/ci/smoke-aces.ps1 target\release\srt-win.exe
      - name: 进程树清理
        run: pwsh vendor/srt-win/ci/smoke-kill.ps1 target\release\srt-win.exe
      - name: 装机期的常设 deny
        run: pwsh vendor/srt-win/ci/smoke-ambient.ps1 target\release\srt-win.exe
      - name: 机器级状态（HKLM + 凭证 ACL）
        run: pwsh vendor/srt-win/ci/smoke-machine-store.ps1 target\release\srt-win.exe
      - name: 收尾（无论成败都要跑）
        if: always()
        run: pwsh vendor/srt-win/ci/cleanup.ps1 target\release\srt-win.exe

  # Riot **自己那层编排**的真机验证。
  #
  # 上面的 win-sandbox-smoke 验的是 srt-win，这个验的是我们怎么用它：
  # `acl grant` 的路径对不对、`srt-win exec` 起的命令能不能写工作区、写工作区
  # 外会不会被拒、退出后 ACE 有没有回收干净。跑的是 sandbox.rs 里那条
  # `windows_经装配路径的沙箱边界` —— 它平时在没装 srt-win 的机器上自动跳过，
  # 这里先装好再跑，于是真的会执行。
  #
  # `[约束]` 必须设 `RIOT_SRT_WIN`。编排默认走 multicall（`current_exe()` +
  # `--srt-win`），而 `cargo test` 里 current_exe 是测试二进制，它没有那个
  # 分发分支。指向真实的 srt-win.exe 才走得通。
  win-sandbox-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p srt-win --release
      # `[约束]` 两步。install 会把账户和 WFP 出网栅栏一起装上，而 Riot 不用
      # 那道栅栏（它会拦掉沙箱账户的全部外连，只放行 loopback 代理端口段）。
      # 不摘掉的话这里测不出问题（用例不联网），但和生产装法就不一致了 ——
      # 而生产上留着它等于沙箱内彻底断网。见 docs/SANDBOX_WINDOWS.md §4。
      - name: 装沙箱账户（并摘掉出网栅栏）
        run: |
          target\release\srt-win.exe install
          target\release\srt-win.exe wfp uninstall
      # 首跑挂在「exec 超时 10s、stdout/stderr 全空」上，而 win-sandbox-smoke
      # 里的 smoke-exec.ps1 跑同一个 exec 是过的 —— 所以 exec 本身能用，差别在
      # 我们怎么调它。三个变量：stdin 被设成 NUL、Riot 用 process-wrap 套了
      # job object、多了 --env 覆盖。逐个探针，把猜变成数据。
      #
      # continue-on-error + timeout-minutes：让三条都跑完再看，别第一条挂住就
      # 没了后面的信息。
      - name: 探针 A｜裸调 exec（对照 smoke 的调用方式）
        continue-on-error: true
        timeout-minutes: 2
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          target\release\srt-win.exe exec --quiet -- cmd /c "echo hello-from-sandbox"
          "A: exit=$LASTEXITCODE elapsed=$([int]$sw.Elapsed.TotalSeconds)s"
      - name: 探针 B｜stdin 接 NUL
        continue-on-error: true
        timeout-minutes: 2
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmd /c "target\release\srt-win.exe exec --quiet -- cmd /c ""echo hello-nul"" < NUL"
          "B: exit=$LASTEXITCODE elapsed=$([int]$sw.Elapsed.TotalSeconds)s"
      - name: 探针 C｜带 --env 覆盖
        continue-on-error: true
        timeout-minutes: 2
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          target\release\srt-win.exe exec --quiet --env "TMP=$env:RUNNER_TEMP" --env "TEMP=$env:RUNNER_TEMP" --env "TMPDIR=$env:RUNNER_TEMP" -- cmd /c "echo hello-env & echo TMP=%TMP%"
          "C: exit=$LASTEXITCODE elapsed=$([int]$sw.Elapsed.TotalSeconds)s"
      # 各盘符的类型。首跑失败在 srt-win 的 mapped_drive_cwd 前置检查上：
      # 它对工作目录所在盘调 GetDriveTypeW，DRIVE_REMOTE(4) 就拒绝启动
      # （seclogon 给沙箱账户建的登录会话里没有 per-user 盘符映射）。这台
      # runner 上 C:\ 报的正是 4，所以要知道哪个盘是本地盘。
      - name: 诊断｜盘符类型（3=本地 4=网络）
        continue-on-error: true
        run: Get-CimInstance Win32_LogicalDisk | Select-Object DeviceID, DriveType, ProviderName | Format-Table
      - name: 编排层端到端
        env:
          RIOT_SRT_WIN: ${{ github.workspace }}\target\release\srt-win.exe
          # 把跳过变成失败：这个 job 刚装完 srt-win，activate 没成功就是真问题。
          RIOT_SANDBOX_TEST_REQUIRE: "1"
          # `[约束]` 测试的工作目录取自 `std::env::temp_dir()`，默认指向
          # C:\Users\…\AppData\Local\Temp，而这台 runner 上 C:\ 报
          # DRIVE_REMOTE —— srt-win 会直接拒绝启动。runner.temp 在 D: 上
          # （和 checkout 出来的工作区同盘），改指到那儿。
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        # 这条超时短一点：挂住的话很快能拿到结论，不用等 job 级超时。
        timeout-minutes: 10
        run: cargo test -p riot-runtime windows_经装配路径的沙箱边界 -- --nocapture
      - name: 收尾（无论成败都要跑）
        if: always()
        run: |
          target\release\srt-win.exe acl recover --force
          target\release\srt-win.exe uninstall

  host-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/prepare-host
      - run: cargo clippy -p riot-host --all-targets -- -D warnings
      - run: cargo test -p riot-host

  extra:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # release 下 invariant! 不 panic，确认优化构建也不会炸
      - run: cargo test ${{ env.KERNEL_ONLY }} --release

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        layer: [permissions, tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/mutate.py --check-anchors
      - run: python3 scripts/mutate.py ${{ matrix.layer }}

  chaos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p riot-core --release chaos_soak -- --nocapture

  chaos-host:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/prepare-host
        with:
          profile: release
      - run: cargo test -p riot-host --release -- --ignored --nocapture
