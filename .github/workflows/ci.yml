# 两人小团队：日常 push 只拦「干净机器上内核还过、协议没漂、Windows 宿主还能编」。
# rustfmt、变异、release 复测、macOS host、混沌长跑放到 nightly / 手动，避免改 UI 也被锚点卡住。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # 内核侧不碰 Tauri，省掉 Linux 上那一大坨 WebKitGTK。
  KERNEL_ONLY: --workspace --exclude riot-host

jobs:
  # L1 协议契约：生成物必须与源类型一致
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - name: 检查协议生成物与 Rust 类型同步
        run: |
          git diff --exit-code schemas/ src/bridge/generated.ts || {
            echo "::error::改了 crates/riot-protocol 但没跑 pnpm gen"
            exit 1
          }
      - run: pnpm typecheck

  # clippy 的 disallowed-methods 是安全闸；debug 测试带着 L2 不变量。
  # golden / fault / e2e 都在 --workspace 里，不再拆 job 重编一遍。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ env.KERNEL_ONLY }} --all-targets -- -D warnings
      - run: cargo test ${{ env.KERNEL_ONLY }}
      - name: 确认没人把黄金基准更新固化进流程
        run: |
          git diff --exit-code crates/riot-core/tests/golden || {
            echo "::error::黄金基准在 CI 里被改写了"
            exit 1
          }

  # 本机是 Mac，跨平台回归全靠 Windows。
  # job 级 if 读不了 matrix，所以 macOS 拆成单独 job，只在 nightly / 手动跑。
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/prepare-host
      - run: cargo clippy -p riot-host --all-targets -- -D warnings
      - run: cargo test -p riot-host

  host-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/prepare-host
      - run: cargo clippy -p riot-host --all-targets -- -D warnings
      - run: cargo test -p riot-host

  extra:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # release 下 invariant! 不 panic，确认优化构建也不会炸
      - run: cargo test ${{ env.KERNEL_ONLY }} --release

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        layer: [permissions, tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/mutate.py --check-anchors
      - run: python3 scripts/mutate.py ${{ matrix.layer }}

  chaos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p riot-core --release chaos_soak -- --nocapture

  chaos-host:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/prepare-host
        with:
          profile: release
      - run: cargo test -p riot-host --release -- --ignored --nocapture
