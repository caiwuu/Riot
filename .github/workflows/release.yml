# 打安装包并挂到 GitHub Release。日常 push 不跑 —— CEF 太重，不该挡 UI 改动。
#
# 触发：
#   - 推 tag `Riot_0.1.0`（版本号对齐 src-tauri/tauri.conf.json）
#   - Actions 里手动跑 Release（先出 draft，核对资产再发布）
#
# 官网下载地址按这个 tag 约定写：
#   Riot_<ver>/Riot_<ver>_aarch64.dmg
#   Riot_<ver>/Riot_<ver>_x64-setup.exe
#
# 未配置 Apple 证书时 macOS 仍能打出 dmg，只是没签名，别人要右键打开。
# 需要公证时在仓库 Secrets 里加 APPLE_CERTIFICATE（p12 的 base64）、
# APPLE_CERTIFICATE_PASSWORD、APPLE_ID、APPLE_PASSWORD、APPLE_TEAM_ID。
name: Release

on:
  push:
    tags:
      - "Riot_*"
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 浏览器脚本和 cef-dll-sys 都认这个。放 workspace 里方便 cache。
  CEF_PATH: ${{ github.workspace }}/.cef

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # 浏览器是独立 workspace，不写进来的话 CEF 绑定每次重编。
          workspaces: |
            . -> target
            crates/riot-browser -> crates/riot-browser/target

      - name: 缓存 CEF 二进制
        uses: actions/cache@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ runner.os }}-${{ runner.arch }}-151.3

      - name: 缓存 CEF 相关 cargo bin
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/export-cef-dir
            ~/.cargo/bin/export-cef-dir.exe
            ~/.cargo/bin/bundle-cef-app
          key: cef-bins-${{ runner.os }}-151.3

      - name: Windows 打开长路径 / MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Git Bash 的 usr\bin 里也有 link.exe。只要这一节还在 PATH 前面，cargo
      # 就会拿 GNU link 去链 MSVC 目标，报 extra operand。从 job PATH 里拿掉，
      # 后面的 pwsh / tauri-action 才用得上刚开的 MSVC。
      - name: 拿掉 Git 的 link.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drop = @('Git\usr\bin', 'Git\bin', 'Git\mingw64\bin')
          $keep = ($env:PATH -split ';' | Where-Object {
            $p = $_
            -not ($drop | Where-Object { $p -like "*$_*" })
          }) -join ';'
          $env:PATH = $keep
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$keep"
          $link = (Get-Command link.exe -ErrorAction SilentlyContinue).Source
          Write-Host "link.exe = $link"
          if (-not $link -or $link -match '(?i)[\\/]Git[\\/]') {
            throw "PATH 里还是 Git 的 link.exe，cargo 编不过"
          }

      - name: 拉取 CEF
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$CEF_PATH/Chromium Embedded Framework.framework" ]]; then
            echo "CEF 缓存命中: $CEF_PATH"
            exit 0
          fi
          if ! command -v export-cef-dir >/dev/null 2>&1; then
            # 版本必须停在 151.3 这一线，和 crates/riot-browser 的 cef crate 对齐。
            cargo install export-cef-dir --locked --version "151.6.0+151.3.18"
          fi
          export-cef-dir --force "$CEF_PATH"

      - name: 打包内置浏览器
        if: runner.os != 'Windows'
        run: ./scripts/build-browser.sh

      # 必须 pwsh：同一条 bash 里再调 powershell，子进程仍继承 Git Bash 的 PATH。
      - name: 打包内置浏览器
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $link = (Get-Command link.exe).Source
          Write-Host "link.exe = $link"
          if ($link -match '(?i)[\\/]Git[\\/]') {
            throw "PATH 里还是 Git 的 link.exe，cargo 编不过"
          }
          scripts/build-browser.ps1

      - run: pnpm install --frozen-lockfile

      # GitHub 没配 secret 时仍会把空字符串写进环境变量。tauri 只要看见
      # APPLE_CERTIFICATE 就去 security import，空数据报
      # `SecKeychainItemImport: parameters not valid`，包已经编出来了也打不成。
      # 有内容才交给下一步；没配就走未签名 dmg（别人要右键打开）。
      - name: 有证书才打开签名
        if: runner.os == 'macOS'
        shell: bash
        env:
          _CERT: ${{ secrets.APPLE_CERTIFICATE }}
          _CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$_CERT" ]]; then
            echo "未配置 APPLE_CERTIFICATE，打未签名 dmg"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<EOF"
            printf '%s\n' "$_CERT"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$_CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$_SIGN_ID"
            echo "APPLE_ID=$_APPLE_ID"
            echo "APPLE_PASSWORD=$_APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "已启用 Apple 签名（证书 ${#_CERT} 字节）"

      # beforeBuildCommand 会再跑 stage-kernel / stage-browser / 前端构建。
      # 浏览器包必须已经在 crates/riot-browser/target/bundle/，否则 stage-browser 直接失败。
      - name: 打安装包并上传 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: Riot___VERSION__
          releaseName: Riot __VERSION__
          releaseBody: |
            macOS：`Riot_*_aarch64.dmg`（Apple Silicon）
            Windows：`Riot_*_x64-setup.exe`
          # 手动跑先出 draft，推 tag 直接挂到正式 Release。
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          tauriScript: pnpm tauri
          retryAttempts: 2
