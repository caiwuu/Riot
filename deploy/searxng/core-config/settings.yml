# Riot 要用的覆盖项。其余沿用镜像默认配置。
# https://docs.searxng.org/admin/settings/

use_default_settings: true

general:
  instance_name: "SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  # 被环境变量 SEARXNG_SECRET 覆盖
  secret_key: "ultrasecretkey"
  # Riot / 脚本会打 format=json；开着 limiter 会 403 或 429
  limiter: false
  image_proxy: true

valkey:
  # 被环境变量 SEARXNG_VALKEY_URL 覆盖
  url: valkey://valkey:6379/0
