# 编译加速。装好工具后取消注释 —— 见 README 的"建议装的加速工具"。
#
# Rust 的增量编译时间会直接变成 AI 的迭代瓶颈：每改一次等一次，
# 累积起来很可观。这个配置的投入是半天，回报是整个项目周期。

# cargo install sccache
# [build]
# rustc-wrapper = "sccache"

# brew install llvm  （提供 lld）
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[alias]
# 常用组合
lint = "clippy --workspace --all-targets -- -D warnings"
gen = "run -p riot-protocol --bin gen_schema"
